<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyrben Construction - Director's Cut</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           CORE ENGINE & LENS EFFECTS
           ========================================= */
        body {
            margin: 0;
            background-color: #000000;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1500px;
        }

        .ui-wrapper {
            position: relative;
            z-index: 10;
            background: #020305;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            box-shadow: 0 60px 120px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,0.15);
            width: 360px;
            height: 680px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            background: rgba(0, 0, 0, 0.8);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 50;
            backdrop-filter: blur(10px);
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .dot.red { background: #ff5f57; }
        .dot.yellow { background: #febc2e; }
        .dot.green { background: #28c840; }
        .title { margin-left: 10px; font-size: 11px; color: #4a5a6e; letter-spacing: 3px; font-weight: 700; }

        /* CAMERA BREATHING - Simulates handheld camera */
        .camera-rig {
            position: relative;
            flex-grow: 1;
            background: #010204;
            overflow: hidden;
            transform-style: preserve-3d;
            animation: cameraBreathe 8s ease-in-out infinite alternate;
        }

        @keyframes cameraBreathe {
            0% { transform: scale(1.03) translate(0px, 0px) rotate(0deg); }
            50% { transform: scale(1.03) translate(-3px, 2px) rotate(0.2deg); }
            100% { transform: scale(1.03) translate(2px, -1px) rotate(-0.1deg); }
        }

        /* Vignette overlay to draw eyes to center */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 40%, #000000 120%);
            z-index: 45;
            pointer-events: none;
        }

        /* Blurred out-of-focus foreground water droplets */
        .lens-drops {
            position: absolute;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(255,255,255,0.03) 0%, transparent 4%),
                radial-gradient(circle at 85% 60%, rgba(255,255,255,0.04) 0%, transparent 5%),
                radial-gradient(circle at 70% 15%, rgba(0,170,255,0.02) 0%, transparent 3%);
            filter: blur(3px);
            opacity: 0.8;
        }

        /* =========================================
           ENVIRONMENT (Fog, Distant City, Canvas)
           ========================================= */
        .distant-city {
            position: absolute;
            bottom: 60px;
            left: -20px;
            width: 400px;
            height: 250px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250"><path d="M0,250 L0,150 L30,150 L30,120 L50,120 L50,180 L90,180 L90,80 L120,80 L120,130 L160,130 L160,60 L190,60 L190,160 L240,160 L240,90 L280,90 L280,140 L320,140 L320,70 L360,70 L360,190 L400,190 L400,250 Z" fill="%23020408"/></svg>') no-repeat bottom left;
            z-index: 1;
            filter: blur(4px);
            opacity: 0.6;
        }

        .fog {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(1, 2, 4, 0.9) 0%, rgba(0, 170, 255, 0.05) 50%, transparent 100%);
            z-index: 8;
            pointer-events: none;
        }

        .lightning {
            position: absolute;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: overlay;
        }

        #rainCanvas {
            position: absolute;
            inset: 0;
            z-index: 7;
            pointer-events: none;
        }

        /* Flickering Streetlamp Cone */
        .streetlamp {
            position: absolute;
            top: -40px;
            left: -50px;
            width: 300px;
            height: 700px;
            background: polygon(50% 0%, 100% 100%, 0% 100%);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            background: linear-gradient(to bottom, rgba(0, 170, 255, 0.12), transparent 80%);
            z-index: 5;
            pointer-events: none;
            transform: rotate(-18deg);
            animation: lampFlicker 6s infinite;
        }

        @keyframes lampFlicker {
            0%, 19.9%, 20.1%, 24.9%, 25.1%, 54.9%, 55.1%, 100% { opacity: 1; }
            20%, 25%, 55% { opacity: 0.3; }
        }

        /* =========================================
           WET STREET & PARALLAX REFLECTION
           ========================================= */
        .street {
            position: absolute;
            bottom: 0;
            left: -10px;
            width: 120%;
            height: 75px;
            background: #010102;
            border-top: 1px solid rgba(0, 170, 255, 0.2);
            z-index: 6;
            overflow: hidden;
        }

        .street::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), #000000 90%);
            z-index: 10;
        }

        .reflection-layer {
            position: absolute;
            top: 0;
            left: 70px; 
            width: 180px;
            height: 100%;
            transform: scaleY(-1) skewX(15deg);
            transform-origin: top;
            opacity: 0.2;
            filter: blur(8px);
            z-index: 7;
        }

        /* =========================================
           3D ARCHITECTURE
           ========================================= */
        .building-3d-wrapper {
            position: absolute;
            bottom: 75px;
            right: 40px;
            width: 140px;
            height: 480px;
            perspective: 800px;
            z-index: 4;
        }

        .building {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transform: rotateY(-28deg); 
            transition: all 2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .face-front {
            position: absolute;
            width: 140px;
            height: 480px;
            background: linear-gradient(to bottom, #04070d, #010204);
            border: 1px solid rgba(0, 170, 255, 0.1);
            transform: translateZ(30px);
            display: flex;
            flex-direction: column-reverse;
            padding: 15px 10px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        .face-side {
            position: absolute;
            width: 60px;
            height: 480px;
            background: linear-gradient(to bottom, #020306, #010102);
            border: 1px solid rgba(0, 170, 255, 0.05);
            transform: rotateY(90deg) translateZ(110px);
            display: flex;
            flex-direction: column-reverse;
            padding: 15px 5px;
            box-sizing: border-box;
            justify-content: space-between;
            filter: brightness(0.5);
        }

        .window-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            height: 14px;
            margin-bottom: 6px;
        }

        .window {
            width: 18%;
            height: 100%;
            background: rgba(255, 255, 255, 0.015);
            border-radius: 1px;
            transition: all 0.1s ease; /* Fast transition for neon flicker */
        }

        .face-side .window { width: 40%; }

        /* Power-On Classes */
        .window.active-warm { background: #fdf0d5; box-shadow: 0 0 20px #fdf0d5, inset 0 0 5px #ffffff; }
        .window.active-gold { background: #f5b041; box-shadow: 0 0 25px #f5b041, 0 0 60px rgba(245,176,65,0.4), inset 0 0 5px #ffffff; }
        .window.active-cool { background: #b0d4ff; box-shadow: 0 0 15px #b0d4ff, inset 0 0 3px #ffffff; }

        /* =========================================
           CINEMATIC SILHOUETTE WITH UMBRELLA
           ========================================= */
        .character-wrapper {
            position: absolute;
            bottom: 70px;
            left: -80px;
            width: 70px;
            height: 110px;
            z-index: 10;
            transform-origin: bottom center;
            filter: drop-shadow(20px 20px 10px rgba(0,0,0,0.9));
        }

        .man-svg {
            width: 100%;
            height: 100%;
            fill: #010102;
            /* Rim light from streetlamp on left side */
            stroke: rgba(0, 170, 255, 0.4);
            stroke-width: 0.8;
            stroke-linecap: round;
        }

        /* Walk Cycle */
        .leg-l { animation: walkReal 1.4s infinite alternate ease-in-out; transform-origin: 50% 65%; }
        .leg-r { animation: walkReal 1.4s infinite alternate-reverse ease-in-out; transform-origin: 50% 65%; }
        /* Body Bobbing */
        .body-bob { animation: bob 0.7s infinite alternate ease-in-out; }

        @keyframes walkReal {
            0% { transform: rotate(-22deg); }
            100% { transform: rotate(22deg); }
        }
        @keyframes bob {
            0% { transform: translateY(0px); }
            100% { transform: translateY(2px); }
        }

        .character-wrapper.walking {
            animation: walkToCenter 4.5s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
        }

        @keyframes walkToCenter { to { left: 45px; } }

        /* =========================================
           GOD-TIER BRAND REVEAL 
           ========================================= */
        #logo {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%) scale(0.6) translateZ(80px);
            opacity: 0;
            z-index: 60;
        }

        #logo img {
            width: 130px;
            height: auto;
            filter: drop-shadow(0 25px 40px rgba(0,0,0,0.9)) drop-shadow(0 0 30px rgba(245, 176, 65, 0.4));
        }

        .brand-group {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translateX(-50%) translateY(40px) translateZ(100px);
            text-align: center;
            opacity: 0;
            z-index: 60;
            width: 340px;
            background: linear-gradient(180deg, rgba(2, 3, 5, 0.75), rgba(0, 0, 0, 0.95));
            padding: 24px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 80px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .brand-group h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 5px 20px rgba(0,0,0,1);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 176, 65, 0.9), transparent);
            width: 0;
            margin: 16px auto;
            box-shadow: 0 0 15px rgba(245, 176, 65, 0.6);
        }

        .motto {
            margin: 0;
            font-size: 13px;
            letter-spacing: 4px;
            color: #6a7c92;
            text-transform: uppercase;
            font-weight: 600;
            min-height: 18px;
        }

        .motto span.gold {
            color: #f5b041;
            font-weight: 700;
            text-shadow: 0 0 25px rgba(245, 176, 65, 0.9);
        }
        
        .type-cursor {
            display: inline-block;
            width: 2px;
            height: 12px;
            background: #f5b041;
            margin-left: 4px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="ui-wrapper">
        <div class="top-bar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">RENDER_ENGINE // ULTRA_REALISM</span>
        </div>

        <div class="camera-rig" id="camera">
            
            <div class="distant-city"></div>
            <div class="lightning" id="lightning"></div>
            <div class="streetlamp"></div>
            <canvas id="rainCanvas"></canvas>
            <div class="fog"></div>

            <div class="building-3d-wrapper">
                <div class="building" id="buildingMesh">
                    <div class="face-front" id="faceFront"></div>
                    <div class="face-side" id="faceSide"></div>
                </div>
            </div>

            <div class="character-wrapper walking" id="walker">
                <svg class="man-svg" viewBox="0 0 100 200">
                    <g class="body-bob">
                        <path d="M 5 60 Q 50 15 95 60 Z" fill="#010102" stroke="rgba(0,170,255,0.6)" stroke-width="1.5"/>
                        <line x1="50" y1="60" x2="50" y2="120" stroke="#010102" stroke-width="2"/>
                        <circle cx="50" cy="80" r="12" />
                        <path d="M 35 95 L 65 95 L 70 150 L 30 150 Z" />
                        <path d="M 35 100 Q 20 120 50 115" fill="none" stroke="#010102" stroke-width="8"/>
                        <g class="leg-l"><path d="M 38 150 L 45 150 L 42 195 L 30 198 Z" /></g>
                        <g class="leg-r"><path d="M 55 150 L 62 150 L 65 195 L 53 198 Z" /></g>
                    </g>
                </svg>
            </div>

            <div class="street">
                <div class="reflection-layer" id="reflectionMesh"></div>
            </div>

            <div class="vignette"></div>
            <div class="lens-drops"></div>

            <div id="logo">
                <img src="https://i.ibb.co/WW7LK0rn/image.png" alt="Skyrben Logo">
            </div>
            
            <div class="brand-group" id="brandGroup">
                <h1>SKYRBEN CONSTRUCTION</h1>
                <div class="divider"></div>
                <p class="motto" id="mottoLine"><span class="type-cursor"></span></p>
            </div>

        </div>
    </div>

    <script>
        // 1. Advanced Rain Physics (Drops + Splashes)
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 360;
        canvas.height = 680;

        const rainArray = [];
        const splashes = [];
        const groundLevel = 605; // Where the street starts

        // Create rain lines
        for (let i = 0; i < 120; i++) {
            rainArray.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 20 + 10,
                speed: Math.random() * 12 + 18,
                opacity: Math.random() * 0.15 + 0.05
            });
        }

        function drawRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Draw Drops
            ctx.lineWidth = 1;
            for (let i = 0; i < rainArray.length; i++) {
                let drop = rainArray[i];
                ctx.strokeStyle = `rgba(255, 255, 255, ${drop.opacity})`;
                ctx.beginPath();
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x - 3, drop.y + drop.length); // Wind angle
                ctx.stroke();
                
                drop.y += drop.speed;
                drop.x -= 3;

                // Hit ground -> Create Splash
                if (drop.y > groundLevel) {
                    for(let s=0; s<3; s++) {
                        splashes.push({
                            x: drop.x,
                            y: groundLevel,
                            vx: (Math.random() - 0.5) * 4,
                            vy: Math.random() * -3 - 1,
                            life: 1
                        });
                    }
                    drop.y = -20;
                    drop.x = Math.random() * canvas.width + 50;
                }
            }

            // Draw Splashes
            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            for(let i = splashes.length - 1; i >= 0; i--) {
                let s = splashes[i];
                ctx.beginPath();
                ctx.arc(s.x, s.y, 0.8, 0, Math.PI * 2);
                ctx.fill();
                
                s.x += s.vx;
                s.y += s.vy;
                s.vy += 0.2; // Gravity
                s.life -= 0.05;
                
                if(s.life <= 0) splashes.splice(i, 1);
            }

            requestAnimationFrame(drawRain);
        }
        drawRain();

        // 2. Initial Thunder & Lightning
        setTimeout(() => {
            const flash = document.getElementById('lightning');
            flash.animate([
                { opacity: 0 }, { opacity: 0.9 }, { opacity: 0 }, { opacity: 0.5 }, { opacity: 0 }
            ], { duration: 350, easing: 'ease-out' });
        }, 1200);

        // 3. Build Architecture
        const faceFront = document.getElementById("faceFront");
        const faceSide = document.getElementById("faceSide");
        const reflectionMesh = document.getElementById("reflectionMesh");
        
        for (let r = 0; r < 20; r++) {
            const rowF = document.createElement("div"); rowF.className = "window-row";
            const rowR = document.createElement("div"); rowR.className = "window-row";
            
            for (let w = 0; w < 4; w++) {
                const win = document.createElement("div"); win.className = "window front-win";
                const rWin = document.createElement("div"); rWin.className = "window";
                rowF.appendChild(win);
                rowR.appendChild(rWin);
            }
            faceFront.appendChild(rowF);
            reflectionMesh.appendChild(rowR);

            const rowS = document.createElement("div"); rowS.className = "window-row";
            for (let w = 0; w < 2; w++) {
                const winS = document.createElement("div"); winS.className = "window side-win";
                rowS.appendChild(winS);
            }
            faceSide.appendChild(rowS);
        }

        // 4. Man Stops & Building Lights Up
        setTimeout(() => {
            document.querySelectorAll('.leg-l, .leg-r, .body-bob').forEach(el => el.style.animation = 'none');
            const walker = document.getElementById("walker");
            walker.style.transform = "rotate(-2deg)"; 
            
            // Neon Flicker Ignition Script
            igniteBuilding();
        }, 4500);

        function igniteBuilding() {
            const fWins = document.querySelectorAll(".front-win");
            const sWins = document.querySelectorAll(".side-win");
            const rWins = document.querySelectorAll("#reflectionMesh .window");
            const lightTypes = ["active-warm", "active-gold", "active-cool", "dark"];
            
            function flickerOn(windowsArray, reflectArray = null) {
                windowsArray.forEach((win, index) => {
                    setTimeout(() => {
                        if (Math.random() > 0.15) { // 85% chance to light up
                            const color = lightTypes[Math.floor(Math.random() * 3)];
                            
                            // The Neon Flicker Effect
                            win.classList.add(color);
                            if(reflectArray) reflectArray[index].classList.add(color);
                            
                            setTimeout(() => {
                                win.classList.remove(color);
                                if(reflectArray) reflectArray[index].classList.remove(color);
                            }, 50);
                            
                            setTimeout(() => {
                                win.classList.add(color);
                                if(reflectArray) reflectArray[index].classList.add(color);
                            }, 120);
                        }
                    }, Math.random() * 2500); // Cascades naturally over 2.5 seconds
                });
            }

            flickerOn(fWins, rWins);
            flickerOn(sWins);

            // Shift camera perspective to reveal building majesty
            document.getElementById("buildingMesh").style.transform = "rotateY(-20deg) scale(1.05)";

            setTimeout(revealBrands, 3000);
        }

        // 5. Cinematic Brand Reveal
        function revealBrands() {
            const logo = document.getElementById("logo");
            logo.style.transition = "all 1.8s cubic-bezier(0.16, 1, 0.3, 1)";
            logo.style.opacity = "1";
            logo.style.transform = "translateX(-50%) scale(1) translateZ(80px)";

            const brandGroup = document.getElementById("brandGroup");
            brandGroup.style.transition = "all 1.5s cubic-bezier(0.16, 1, 0.3, 1)";
            brandGroup.style.opacity = "1";
            brandGroup.style.transform = "translateX(-50%) translateY(0) translateZ(100px)";

            document.querySelector(".divider").animate(
                [ { width: "0" }, { width: "100%" } ],
                { duration: 1500, fill: "forwards", easing: "ease-out" }
            );

            setTimeout(typeMotto, 1200);
        }

        // 6. Terminal Typer
        function typeMotto() {
            const text = "WHERE QUALITY MEETS HERE";
            const target = document.getElementById("mottoLine");
            let i = 0;

            const typewriter = setInterval(() => {
                if (i < text.length) {
                    let str = text.substring(0, i + 1);
                    if (str.includes("QUALITY")) str = str.replace("QUALITY", "<span class='gold'>QUALITY</span>");
                    target.innerHTML = str + '<span class="type-cursor"></span>';
                    i++;
                } else {
                    clearInterval(typewriter);
                    setTimeout(() => document.querySelector('.type-cursor').style.display = 'none', 1000);
                }
            }, 60);
        }

        // 7. Transition Out
        setTimeout(() => {
            document.body.style.transition = "opacity 2s ease";
            document.body.style.opacity = "0";
        }, 11500);

        setTimeout(() => {
            window.location.href = "https://sites.google.com/view/skyrbenconstruction-1/home";
        }, 13500);
    </script>
</body>
</html>
