<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyrben Construction</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           CORE & BACKGROUND STYLES
           ========================================= */
        body {
            margin: 0;
            background-color: #03050a;
            /* Moving Tech Grid Background */
            background-image: 
                linear-gradient(rgba(0, 170, 255, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 170, 255, 0.08) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: moveGrid 20s linear infinite;
            color: #ffffff;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        @keyframes moveGrid {
            0% { background-position: 0 0; }
            100% { background-position: 50px 50px; }
        }

        /* =========================================
           MAIN UI WRAPPER
           ========================================= */
        .ui-wrapper {
            background: linear-gradient(135deg, rgba(10, 15, 25, 0.9), rgba(5, 8, 15, 0.95));
            border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 16px;
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.9), 
                0 0 40px rgba(0, 170, 255, 0.15),
                inset 0 0 20px rgba(0, 170, 255, 0.05);
            backdrop-filter: blur(10px);
            overflow: hidden;
            width: 360px;
            height: 680px;
            display: flex;
            flex-direction: column;
            /* Cinematic Entrance */
            opacity: 0;
            transform: scale(0.9) translateY(30px);
            animation: wrapperEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes wrapperEntrance {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .top-bar {
            background: rgba(255, 255, 255, 0.02);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0, 170, 255, 0.15);
        }

        .dot { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; box-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; box-shadow: 0 0 12px #27c93f; }
        .title { margin-left: 12px; font-size: 13px; color: #00aaff; letter-spacing: 3px; font-weight: 700; text-shadow: 0 0 8px rgba(0,170,255,0.4); }

        .animation-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================================
           BUILDING & ANIMATIONS
           ========================================= */
        .building {
            position: absolute;
            bottom: 30px;
            width: 300px;
            height: 550px;
        }

        .tower-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
        }

        .wire {
            fill: none;
            stroke: #00aaff;
            stroke-width: 3;
            filter: drop-shadow(0 0 12px #00aaff);
            stroke-dasharray: 2000;
            stroke-dashoffset: 2000;
            animation: drawLine 3.5s ease-in-out forwards;
        }

        .floor { animation-delay: .5s; }

        @keyframes drawLine {
            to { stroke-dashoffset: 0; }
        }

        /* Holographic Scanner */
        .scanner {
            position: absolute;
            top: 0;
            left: 50px;
            width: 200px;
            height: 2px;
            background: #00aaff;
            box-shadow: 0 0 20px 5px rgba(0, 170, 255, 0.6);
            z-index: 10;
            opacity: 0;
        }

        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }
        }

        .windows {
            position: absolute;
            top: 130px;
            left: 85px;
            width: 130px;
            height: 390px;
            z-index: 4;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            padding: 5px;
            box-sizing: border-box;
        }

        .window {
            background: rgba(255, 255, 255, 0.02);
            border-radius: 2px;
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }

        #energy {
            position: absolute;
            bottom: 0px;
            left: 148px;
            width: 4px;
            height: 0px;
            background: linear-gradient(to top, #f5b041, #ffffff);
            box-shadow: 0 0 20px #f5b041, 0 0 40px #f5b041;
            z-index: 5;
            opacity: 0;
            border-radius: 4px;
        }

        /* =========================================
           BRANDING & TYPOGRAPHY
           ========================================= */
        #logo {
            position: absolute;
            top: 12%;
            left: 50%;
            transform: translateX(-50%) scale(0);
            opacity: 0;
            z-index: 20;
        }

        #logo img {
            width: 110px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(245, 176, 65, 0.5));
        }

        /* Floating animation added via JS after reveal */
        @keyframes float {
            0% { transform: translateX(-50%) translateY(0px); }
            50% { transform: translateX(-50%) translateY(-10px); }
            100% { transform: translateX(-50%) translateY(0px); }
        }

        .brand-group {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%) translateY(40px) scale(0.95);
            text-align: center;
            opacity: 0;
            z-index: 30;
            width: 330px;
            background: linear-gradient(180deg, rgba(5, 8, 15, 0.9), rgba(10, 15, 25, 0.95));
            padding: 24px 10px;
            border-radius: 12px;
            border: 1px solid rgba(245, 176, 65, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.9), inset 0 0 20px rgba(245, 176, 65, 0.05);
            backdrop-filter: blur(12px);
        }

        .brand-group h1 {
            margin: 0;
            font-size: 27px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #ffffff;
            white-space: nowrap;
            text-shadow: 0 5px 15px rgba(0,0,0,1);
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #f5b041, transparent);
            width: 0;
            margin: 14px auto;
            box-shadow: 0 0 15px #f5b041;
        }

        .motto {
            margin: 0;
            font-size: 14px;
            letter-spacing: 5px;
            color: #8a99ad;
            text-transform: uppercase;
            font-weight: 500;
        }

        .motto span {
            color: #f5b041;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(245, 176, 65, 0.6);
        }
    </style>
</head>
<body>

    <div class="ui-wrapper">
        <div class="top-bar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">SYS_DEPLOY // SKYRBEN</span>
        </div>

        <div class="animation-container">
            <div class="building">
                <div class="scanner" id="scanner"></div>

                <svg class="tower-svg" viewBox="0 0 300 600">
                    <path class="wire" d="M80 580 L80 120 L150 20 L220 120 L220 580 Z"/>
                    <path class="wire floor" d="M80 500 L220 500"/>
                    <path class="wire floor" d="M80 430 L220 430"/>
                    <path class="wire floor" d="M80 360 L220 360"/>
                    <path class="wire floor" d="M80 290 L220 290"/>
                    <path class="wire floor" d="M80 220 L220 220"/>
                    <path class="wire" d="M150 20 L150 580"/>
                </svg>
                <div class="windows" id="windows"></div>
                <div id="energy"></div>
            </div>

            <div id="logo">
                <img src="https://i.ibb.co/WW7LK0rn/image.png" alt="Skyrben Logo">
            </div>
            
            <div class="brand-group" id="brandGroup">
                <h1>SKYRBEN CONSTRUCTION</h1>
                <div class="divider"></div>
                <p class="motto">WHERE <span>QUALITY</span> MEETS HERE</p>
            </div>
        </div>
    </div>

    <script>
        /* =========================================
           JAVASCRIPT ANIMATION TIMELINE
           ========================================= */

        // 1. Create Windows immediately
        const windowsContainer = document.getElementById("windows");
        for (let i = 0; i < 120; i++) {
            const win = document.createElement("div");
            win.className = "window";
            windowsContainer.appendChild(win);
        }

        // 2. Start Scanner Effect shortly after load
        setTimeout(() => {
            const scanner = document.getElementById("scanner");
            scanner.style.animation = "scan 3s cubic-bezier(0.4, 0, 0.2, 1) infinite";
        }, 1000);

        // 3. Reveal Logo and Brand Text (At 3.5 Seconds!)
        setTimeout(() => {
            // Pop in Logo with sick bounce
            const logo = document.getElementById("logo");
            logo.style.transition = "all 1s cubic-bezier(0.34, 1.56, 0.64, 1)";
            logo.style.opacity = "1";
            logo.style.transform = "translateX(-50%) scale(1)";
            
            // Add continuous float effect after popping in
            setTimeout(() => {
                logo.style.animation = "float 4s ease-in-out infinite";
            }, 1000);

            // Fade in and slide up the Brand Group
            const brandGroup = document.getElementById("brandGroup");
            brandGroup.style.transition = "all 0.8s cubic-bezier(0.16, 1, 0.3, 1)";
            brandGroup.style.opacity = "1";
            brandGroup.style.transform = "translateX(-50%) translateY(0) scale(1)";

            // Draw the glowing straight line
            document.querySelector(".divider").animate(
                [ { width: "0" }, { width: "100%" } ],
                { duration: 1000, fill: "forwards", easing: "ease-out" }
            );
        }, 3500);

        // 4. Window Lighting Sequence (Cascade Effect)
        setTimeout(() => {
            // Remove the scanner when windows light up
            document.getElementById("scanner").style.display = "none";

            document.querySelectorAll(".window").forEach((win, index) => {
                setTimeout(() => {
                    win.style.background = "#f5b041";
                    win.style.boxShadow = "0 0 12px #f5b041";
                }, index * 15); // slightly faster cascade
            });
        }, 4200);

        // 5. Intense Gold Energy Line
        setTimeout(() => {
            const energy = document.getElementById("energy");
            energy.style.opacity = "1";
            energy.animate(
                [ { height: "0px" }, { height: "480px" } ],
                { duration: 1000, fill: "forwards", easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" }
            );
        }, 5000);

        // 6. Gold Pulse Effect on Title
        setTimeout(() => {
            document.querySelector(".brand-group h1").animate(
                [
                    { textShadow: "0 0 10px rgba(245,176,65,.5)" },
                    { textShadow: "0 0 40px rgba(245,176,65,1), 0 0 80px rgba(245,176,65,0.8)" },
                    { textShadow: "0 0 10px rgba(245,176,65,.5)" }
                ],
                { duration: 2000, iterations: 2 }
            );
        }, 5800);

        // 7. Smooth Fade Out 
        setTimeout(() => {
            document.body.style.transition = "opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1)";
            document.body.style.opacity = "0";
        }, 8500);

        // 8. Redirect
        setTimeout(() => {
            window.location.href = "https://sites.google.com/view/skyrbenconstruction-1/home";
        }, 9800);
    </script>
</body>
</html>
