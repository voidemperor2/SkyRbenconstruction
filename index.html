<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SKYRBEN CONSTRUCTION</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#07111a;
font-family:Arial,sans-serif;
}

/* Intro */

#intro{
position:fixed;
inset:0;
background:#07111a;
overflow:hidden;
}

/* Road */

.road{
position:absolute;
bottom:0;
left:50%;
transform:translateX(-50%);
width:20%;
height:100%;
background:
linear-gradient(
to top,
#1d1d1d,
#2b2b2b
);
clip-path:
polygon(
45% 100%,
55% 100%,
80% 0,
20% 0
);
}

/* Road center line */

.line{
position:absolute;
left:50%;
bottom:-100%;
width:6px;
height:200%;
background:#f5b041;
transform:translateX(-50%);
animation:moveRoad 3s linear forwards;
}

@keyframes moveRoad{
from{
transform:
translateX(-50%)
translateY(0);
}
to{
transform:
translateX(-50%)
translateY(40%);
}
}

/* Tower */

.tower{
position:absolute;
left:50%;
bottom:20%;
width:120px;
height:260px;
transform:
translateX(-50%)
scale(.25);
background:
linear-gradient(
180deg,
#153247,
#0b1720
);

box-shadow:
0 0 30px rgba(0,170,255,.3);

animation:
approach 3s forwards;
}

@keyframes approach{

to{
transform:
translateX(-50%)
scale(1);
}

}

/* Windows */

.window{
position:absolute;
width:12px;
height:12px;
background:#f5b041;
opacity:0;
animation:
lightOn .5s forwards;
}

@keyframes lightOn{
to{
opacity:1;
box-shadow:
0 0 12px #f5b041;
}
}

/* Logo */

.logo{
position:absolute;
top:18%;
left:50%;
transform:
translateX(-50%);
color:#f5b041;
font-size:52px;
font-weight:bold;
opacity:0;
animation:
showLogo .8s forwards;
animation-delay:3.3s;
}

@keyframes showLogo{
to{
opacity:1;
}
}

/* Text */

.brand{
position:absolute;
bottom:10%;
width:100%;
text-align:center;
opacity:0;
animation:
brand 1s forwards;
animation-delay:3.8s;
}

.brand h1{
color:#f5b041;
letter-spacing:4px;
}

.brand p{
color:white;
margin-top:10px;
letter-spacing:3px;
}

@keyframes brand{
to{
opacity:1;
}
}

</style>

</head>

<body>

<div id="intro">

<div class="road">
<div class="line"></div>
</div>

<div class="tower" id="tower"></div>

<div class="logo">SKYRBEN</div>

<div class="brand">
<h1>SKYRBEN CONSTRUCTION</h1>
<p>WHERE QUALITY MEETS HERE</p>
</div>

</div>

<script>

const tower =
document.getElementById("tower");

/* Generate windows */

for(let r=0;r<10;r++){

for(let c=0;c<5;c++){

const w =
document.createElement("div");

w.className="window";

w.style.left =
(15+c*20)+"px";

w.style.top =
(15+r*22)+"px";

w.style.animationDelay =
(2+r*.1+c*.05)+"s";

tower.appendChild(w);

}

}

/* Redirect */

setTimeout(()=>{

window.location.href=
"https://sites.google.com/view/skyrbenconstruction-1/home";

},5500);

</script>

</body>
</html>
