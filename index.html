<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYRBEN CONSTRUCTION — Cinematic Intro</title>
<style>
:root{--gold:#d7aa3f;--gold2:#ffe08a;--ink:#02060b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Segoe UI,Arial,sans-serif}body{user-select:none}
#app{position:fixed;inset:0;background:#02060b}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#overlay{position:absolute;inset:0;pointer-events:none}
#vignette{position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,transparent 42%,rgba(0,0,0,.48) 100%)}
#fade{position:absolute;inset:0;background:#000;opacity:1;transition:opacity 1.4s ease}
#brand{position:absolute;left:50%;bottom:8%;transform:translate(-50%,22px);text-align:center;color:#fff;opacity:0;letter-spacing:.14em;transition:opacity 1s ease,transform 1s ease;text-shadow:0 8px 30px rgba(0,0,0,.55)}
#brand .name{font-size:clamp(24px,4vw,54px);font-weight:800;color:var(--gold2);letter-spacing:.22em;white-space:nowrap}
#brand .sub{margin-top:8px;font-size:clamp(11px,1.2vw,17px);letter-spacing:.42em;color:#fff;opacity:.9}
#brand .tag{margin-top:14px;font-size:clamp(10px,1vw,14px);letter-spacing:.32em;color:#d9e2ea;opacity:.8}
#skip{position:absolute;right:22px;bottom:18px;border:1px solid rgba(255,255,255,.22);color:#fff;background:rgba(3,8,13,.45);backdrop-filter:blur(8px);padding:9px 14px;border-radius:999px;font-size:11px;letter-spacing:.12em;opacity:.65;pointer-events:auto;cursor:pointer}
#progress{position:absolute;left:22px;bottom:24px;width:180px;height:2px;background:rgba(255,255,255,.16);overflow:hidden;border-radius:2px}
#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 12px var(--gold)}
#hud{position:absolute;top:18px;left:22px;color:#fff;opacity:.5;font-size:9px;letter-spacing:.22em;text-transform:uppercase}
@media(max-width:700px){#brand .name{letter-spacing:.12em}#brand .sub{letter-spacing:.24em}#brand .tag{letter-spacing:.18em}#progress{width:120px;left:16px}#skip{right:16px}}
</style>
</head>
<body>
<div id="app"><canvas id="scene"></canvas><div id="overlay"><div id="vignette"></div><div id="hud">SKYRBEN // ARCHITECTURAL FILM</div><div id="progress"><i></i></div><button id="skip" type="button">ENTER SITE</button><div id="brand"><div class="name">SKYRBEN</div><div class="sub">CONSTRUCTION</div><div class="tag">WHERE QUALITY MEETS HERE</div></div><div id="fade"></div></div></div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('scene'),ctx=canvas.getContext('2d',{alpha:false});
const fade=document.getElementById('fade'),progress=document.querySelector('#progress i'),brand=document.getElementById('brand'),skip=document.getElementById('skip');
const REDIRECT='https://sites.google.com/view/skyrbenconstruction-1';
const LOGO_URL='https://i.ibb.co/21DM8HM8/Chat-GPT-Image-Jul-3-2026-02-13-07-PM.png';
let W=0,H=0,DPR=1,start=performance.now(),redirected=false;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t,easeInOut=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,easeOut=t=>1-Math.pow(1-t,3);
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
const logoImg=new Image();logoImg.crossOrigin='anonymous';logoImg.src=LOGO_URL;
const stars=Array.from({length:460},()=>({x:Math.random(),y:Math.random()*.67,r:rnd(.4,1.8),a:rnd(.2,.9),tw:rnd(1,4),p:Math.random()*6.28}));
const clouds=Array.from({length:15},()=>({x:rnd(-.3,1.1),y:rnd(.05,.45),w:rnd(.12,.35),h:rnd(.025,.07),speed:rnd(.0008,.0025),a:rnd(.025,.08)}));
const shooting=[];let nextShoot=2.7;
const styles=[{type:'box',w:.055,h:.25},{type:'box',w:.045,h:.34},{type:'stepped',w:.075,h:.30},{type:'box',w:.06,h:.42},{type:'slant',w:.05,h:.36},{type:'twin',w:.10,h:.31}];
function makeBuilding(){const s=styles[Math.floor(Math.random()*styles.length)];return{depth:Math.random(),x:rnd(.03,.97),style:s,baseW:s.w*rnd(.75,1.25),baseH:s.h*rnd(.75,1.25),tint:Math.random(),beacon:Math.random()<.28}}
const backCity=Array.from({length:30},makeBuilding),midCity=Array.from({length:23},makeBuilding),frontCity=Array.from({length:14},makeBuilding);
const cars=Array.from({length:30},()=>({lane:Math.random()*2|0,z:Math.random(),speed:rnd(.07,.16),hue:Math.random()<.78?'white':'red'}));
const helicopter={x:-.15,y:.22,speed:.055},airplane={x:1.15,y:.12,speed:.014};
const particles=[];function addParticle(x,y,vx,vy,life,size,kind='gold'){particles.push({x,y,vx,vy,life,ttl:life,size,kind})}
function drawSky(t){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#01040a');g.addColorStop(.28,'#06111c');g.addColorStop(.62,'#0c1f2f');g.addColorStop(1,'#03070c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const s of stars){const tw=.45+.55*(.5+.5*Math.sin(t*s.tw+s.p));ctx.globalAlpha=s.a*tw;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;
 const mx=W*.82,my=H*.15,mr=Math.min(W,H)*.075;const mg=ctx.createRadialGradient(mx,my,0,mx,my,mr*2.8);mg.addColorStop(0,'rgba(255,255,255,.22)');mg.addColorStop(.45,'rgba(180,215,240,.09)');mg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,mr*2.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#edf4fa';ctx.beginPath();ctx.arc(mx,my,mr,0,Math.PI*2);ctx.fill();
 for(const c of clouds){c.x+=c.speed;if(c.x>1.2)c.x=-.35;const x=c.x*W,y=c.y*H,w=c.w*W,h=c.h*H,cg=ctx.createRadialGradient(x+w*.5,y+h*.5,0,x+w*.5,y+h*.5,w*.55);cg.addColorStop(0,`rgba(190,215,230,${c.a})`);cg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(x+w*.5,y+h*.5,w*.55,h*.75,0,0,Math.PI*2);ctx.fill()}
 if(t>nextShoot){shooting.push({x:rnd(.1,.75),y:rnd(.05,.35),life:0});nextShoot=t+rnd(3.5,6.5)}
 for(let i=shooting.length-1;i>=0;i--){const s=shooting[i];s.life+=.03;const x=(s.x+s.life*.16)*W,y=(s.y+s.life*.1)*H;ctx.strokeStyle=`rgba(255,255,255,${Math.max(0,1-s.life/1.2)})`;ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-60,y-35);ctx.lineTo(x,y);ctx.stroke();if(s.life>1.2)shooting.splice(i,1)}
}
function buildingPath(x,y,w,h,type){ctx.beginPath();if(type==='slant'){ctx.moveTo(x,y+h);ctx.lineTo(x+w*.18,y);ctx.lineTo(x+w,y+h*.08);ctx.lineTo(x+w,y+h);ctx.closePath()}else if(type==='stepped'){ctx.moveTo(x,y+h);ctx.lineTo(x,y+h*.18);ctx.lineTo(x+w*.18,y+h*.18);ctx.lineTo(x+w*.18,y);ctx.lineTo(x+w*.82,y);ctx.lineTo(x+w*.82,y+h*.1);ctx.lineTo(x+w,y+h*.1);ctx.lineTo(x+w,y+h);ctx.closePath()}else if(type==='twin'){ctx.rect(x,y+h*.16,w*.42,h*.84);ctx.rect(x+w*.52,y,w*.42,h)}else ctx.rect(x,y,w,h)}
function drawBuilding(b,t,idx,scale){const h=H*b.baseH*scale,w=W*b.baseW*scale,x=b.x*W-w/2,y=H*.73-h;const grad=ctx.createLinearGradient(0,y,0,y+h);grad.addColorStop(0,['#6aa6c8','#4d83a3','#7ab4d0'][Math.floor(b.tint*3)]);grad.addColorStop(.45,'#173d55');grad.addColorStop(1,'#07131d');ctx.fillStyle=grad;buildingPath(x,y,w,h,b.style.type);ctx.fill();ctx.strokeStyle='rgba(205,235,255,.10)';ctx.lineWidth=1;const cols=Math.max(2,Math.floor(w/24));for(let i=1;i<cols;i++){const xx=x+i*w/cols;ctx.beginPath();ctx.moveTo(xx,y);ctx.lineTo(xx,y+h);ctx.stroke()}const rows=Math.max(4,Math.floor(h/24));for(let r=1;r<rows;r++)for(let c=0;c<cols;c++)if(((r*17+c*13+idx)%7)/7<.56){const wx=x+7+c*(w-14)/Math.max(1,cols-1),wy=y+12+r*(h-24)/rows;ctx.fillStyle=(r+c+idx)%9===0?'rgba(255,216,124,.85)':'rgba(173,216,255,.45)';ctx.fillRect(wx,wy,Math.min(6,w*.035),Math.min(7,h*.018))}const sweep=((t*.18+idx*.09)%1.5)-.25,sx=x+w*sweep,rg=ctx.createLinearGradient(sx-w*.12,0,sx+w*.12,0);rg.addColorStop(0,'rgba(255,255,255,0)');rg.addColorStop(.5,'rgba(255,255,255,.15)');rg.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=rg;ctx.globalAlpha=.55;buildingPath(x,y,w,h,b.style.type);ctx.fill();ctx.globalAlpha=1;if(b.beacon){const blink=.5+.5*Math.sin(t*5+idx);ctx.fillStyle=`rgba(255,50,50,${blink})`;ctx.shadowBlur=9;ctx.shadowColor='#ff3333';ctx.beginPath();ctx.arc(x+w/2,y+4,2.2,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}}
function drawCity(t,cam){drawLayer(backCity,t,.48,cam*.55);drawLayer(midCity,t,.72,cam*.8);drawLayer(frontCity,t,1,cam)}
function drawLayer(list,t,scale,offset){for(let i=0;i<list.length;i++)drawBuilding({...list[i],x:clamp(list[i].x+offset*.025*Math.sin(i*1.7),.02,.98)},t,i,scale)}
function drawRoad(t){const top=H*.63;ctx.fillStyle='#071016';ctx.beginPath();ctx.moveTo(W*.45,top);ctx.lineTo(W*.55,top);ctx.lineTo(W*1.15,H);ctx.lineTo(-W*.15,H);ctx.closePath();ctx.fill();const rg=ctx.createLinearGradient(0,top,0,H);rg.addColorStop(0,'rgba(80,150,190,.16)');rg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,top,W,H-top);for(let lane=-2;lane<=2;lane++){const topX=W*.5+lane*10,botX=W*.5+lane*W*.24;ctx.strokeStyle='rgba(245,198,87,.72)';ctx.lineWidth=2;ctx.setLineDash([32,28]);ctx.lineDashOffset=-(t*180)%60;ctx.beginPath();ctx.moveTo(topX,top);ctx.lineTo(botX,H);ctx.stroke()}ctx.setLineDash([]);for(let i=0;i<8;i++){const z=((i/8)+(t*.08))%1,y=lerp(top+10,H*.98,easeOut(z)),s=lerp(.25,1.4,easeOut(z));for(const side of [-1,1]){const x=side<0?lerp(W*.52,W*.13,z):lerp(W*.48,W*.87,z);ctx.strokeStyle='#4c5962';ctx.lineWidth=2*s;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y-48*s);ctx.stroke();ctx.fillStyle='rgba(255,205,110,.9)';ctx.shadowBlur=16*s;ctx.shadowColor='#ffd36a';ctx.beginPath();ctx.arc(x,y-48*s,4*s,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}}for(const car of cars){car.z=(car.z+car.speed*.002)%1;const z=car.z,y=lerp(top+5,H*.96,easeOut(z)),laneX=W*.5+(car.lane?1:-1)*lerp(8,W*.2,z),size=lerp(2,14,z);ctx.fillStyle=car.hue==='white'?'#dff4ff':'#ff4a40';ctx.shadowBlur=18*z;ctx.shadowColor=ctx.fillStyle;ctx.fillRect(laneX-size/2,y-size/2,size,size*.5);ctx.shadowBlur=0}}
function drawAircraft(t){helicopter.x+=helicopter.speed*.002;if(helicopter.x>1.2)helicopter.x=-.2;const hx=helicopter.x*W,hy=helicopter.y*H+Math.sin(t*1.2)*10;ctx.strokeStyle='rgba(190,220,240,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(hx+22,hy-4);ctx.stroke();ctx.fillStyle='#d8eaf3';ctx.fillRect(hx-7,hy-3,14,6);ctx.fillStyle='#ff5252';ctx.beginPath();ctx.arc(hx+7,hy,2,0,Math.PI*2);ctx.fill();airplane.x-=airplane.speed*.002;if(airplane.x<-.2)airplane.x=1.2;const px=airplane.x*W,py=airplane.y*H+Math.sin(t*.25)*8;ctx.fillStyle='rgba(225,240,250,.75)';ctx.fillRect(px,py,18,3);ctx.fillStyle='rgba(220,240,255,.35)';ctx.fillRect(px+15,py+2,35,1)}
function drawHQ(t,stage){const reveal=clamp((stage-6.2)/1.5,0,1),sx=lerp(.28,1,easeInOut(reveal)),baseW=Math.min(W*.18,250)*sx,baseH=Math.min(H*.58,650)*sx,x=W*.5,baseY=H*.73,y=baseY-baseH,frame=clamp((stage-6.0)/1.1,0,1),glass=clamp((stage-7)/1.1,0,1);if(reveal){const g=ctx.createRadialGradient(x,y+baseH*.55,0,x,y+baseH*.55,baseH*.75);g.addColorStop(0,'rgba(90,190,255,.20)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-baseH,y-baseH*.4,baseH*2,baseH*1.6)}ctx.save();ctx.translate(x,baseY);ctx.scale(sx,sx);const w=baseW/Math.max(.01,sx),h=baseH/Math.max(.01,sx);if(frame){ctx.strokeStyle=`rgba(160,200,220,${.85*frame})`;ctx.lineWidth=2;for(let i=0;i<7;i++){const xx=-w*.42+i*w*.14;ctx.beginPath();ctx.moveTo(xx,0);ctx.lineTo(xx*.72,-h);ctx.stroke()}for(let r=0;r<12;r++){const yy=-r*h/12;ctx.beginPath();ctx.moveTo(-w*.48,yy);ctx.lineTo(w*.48,yy);ctx.stroke()}}if(glass){const gr=ctx.createLinearGradient(0,-h,0,0);gr.addColorStop(0,'#5c9bb7');gr.addColorStop(.35,'#214b61');gr.addColorStop(1,'#07131b');ctx.fillStyle=gr;roundRect(-w*.45,-h,w*.9,h,10);ctx.fill();ctx.strokeStyle='rgba(219,242,255,.20)';ctx.lineWidth=1;for(let i=0;i<8;i++){const xx=-w*.4+i*w*.115;ctx.beginPath();ctx.moveTo(xx,-h);ctx.lineTo(xx,0);ctx.stroke()}for(let r=1;r<18;r++)for(let c=0;c<8;c++)if((r*11+c*7)%13<7){ctx.fillStyle=(r+c)%8===0?'rgba(255,220,140,.9)':'rgba(177,224,255,.45)';ctx.fillRect(-w*.37+c*w*.105,-h*.04-r*h*.052,w*.045,h*.026)}}if(glass>.4){ctx.fillStyle='#0c1b25';ctx.beginPath();ctx.moveTo(-w*.18,-h);ctx.lineTo(0,-h-w*.18);ctx.lineTo(w*.18,-h);ctx.closePath();ctx.fill();ctx.strokeStyle='#d7aa3f';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-w*.16,-h);ctx.lineTo(0,-h-w*.16);ctx.lineTo(w*.16,-h);ctx.stroke()}if(frame<1){for(const dir of[-1,1]){const cx=dir*w*.48;ctx.strokeStyle='#7e8d95';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(cx,0);ctx.lineTo(cx,-h*.78);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,-h*.7);ctx.lineTo(cx-dir*w*.45,-h*.7);ctx.stroke();ctx.strokeStyle='rgba(245,198,87,.35)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(cx-dir*w*.45,-h*.7);ctx.lineTo(cx-dir*w*.65,-h*.05);ctx.stroke()}}const energy=clamp((stage-7.7)/1,0,1);if(energy){ctx.strokeStyle=`rgba(255,210,105,${energy})`;ctx.shadowBlur=16;ctx.shadowColor='#d7aa3f';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-h*energy);ctx.stroke();ctx.shadowBlur=0}if(glass>.85&&logoImg.complete&&logoImg.naturalWidth){const pw=w*.58,ph=pw*(logoImg.naturalHeight/logoImg.naturalWidth),ly=-h*.66;ctx.fillStyle='rgba(0,0,0,.25)';roundRect(-pw/2,ly-8,pw,ph+16,8);ctx.fill();ctx.globalAlpha=clamp((stage-8.15)/.75,0,1);ctx.shadowBlur=24;ctx.shadowColor='#d7aa3f';ctx.drawImage(logoImg,-pw/2,ly,pw,ph);ctx.restore()}else ctx.restore();if(stage>8.1){for(let i=0;i<4;i++){const a=Math.random()*6.28,r=rnd(baseW*.12,baseW*.65);addParticle(x+Math.cos(a)*r,baseY-baseH*.45+Math.sin(a)*r,rnd(-.12,.12),rnd(-.5,-.1),rnd(.5,1.2),rnd(1,3))}}}
function roundRect(x,y,w,h,r){r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function updateParticles(dt){for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.x+=p.vx*dt*60;p.y+=p.vy*dt*60;p.vy+=.003*dt*60;if(p.life<=0)particles.splice(i,1)}}
function drawParticles(){for(const p of particles){const a=clamp(p.life/p.ttl,0,1);ctx.fillStyle=`rgba(255,220,125,${a})`;ctx.shadowBlur=12;ctx.shadowColor='#d7aa3f';ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill()}ctx.shadowBlur=0}
function drawAtmosphere(){const fog=ctx.createLinearGradient(0,H*.55,0,H);fog.addColorStop(0,'rgba(140,190,220,0)');fog.addColorStop(.55,'rgba(130,170,190,.05)');fog.addColorStop(1,'rgba(2,6,10,.72)');ctx.fillStyle=fog;ctx.fillRect(0,H*.55,W,H*.45)}
function frame(now){const t=(now-start)/1000;ctx.clearRect(0,0,W,H);drawSky(t);const cam=clamp((t-1.5)/4,0,1),zoom=1+cam*.14;ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-W/2,-H/2);drawCity(t,cam);drawRoad(t);drawAircraft(t);drawHQ(t,t);drawAtmosphere();updateParticles(1/60);drawParticles();ctx.restore();progress.style.width=`${clamp(t/12,0,1)*100}%`;fade.style.opacity=t<.8?1-t/.8:t>11.2?clamp((t-11.2)/.8,0,1):0;if(t>9.2){brand.style.opacity=clamp((t-9.2)/.9,0,1);brand.style.transform=`translate(-50%,${lerp(22,0,easeOut(clamp((t-9.2)/.9,0,1)))}px)`}if(t>=12&&!redirected){redirected=true;window.location.href=REDIRECT}requestAnimationFrame(frame)}requestAnimationFrame(frame);
skip.addEventListener('click',()=>{if(redirected)return;redirected=true;fade.style.transition='opacity .45s ease';fade.style.opacity='1';setTimeout(()=>location.href=REDIRECT,450)});
addEventListener('keydown',e=>{if(e.key==='Escape')skip.click()});
addEventListener('pointermove',e=>{const nx=e.clientX/W-.5,ny=e.clientY/H-.5;canvas.style.transform=`translate(${nx*2}px,${ny*2}px)`});
})();
</script>
</body>
</html>
