<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyrben Construction - Hyper-Realistic Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           ENVIRONMENT & FOG
           ========================================= */
        body {
            margin: 0;
            background-color: #000103;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1500px;
        }

        /* Ambient Fog Layer */
        .fog {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at center, transparent 20%, #010205 80%);
            z-index: 8;
            pointer-events: none;
        }

        /* Lightning Flash Element */
        .lightning {
            position: absolute;
            inset: 0;
            background: #ffffff;
            opacity: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* =========================================
           PREMIUM TERMINAL UI
           ========================================= */
        .ui-wrapper {
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, #050810 0%, #010204 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            box-shadow: 0 50px 100px rgba(0,0,0,1), inset 0 1px 0 rgba(255,255,255,0.1);
            width: 360px;
            height: 680px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        .top-bar {
            background: rgba(0, 0, 0, 0.5);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 20;
            backdrop-filter: blur(10px);
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .dot.red { background: #ff5f57; }
        .dot.yellow { background: #febc2e; }
        .dot.green { background: #28c840; }
        .title { margin-left: 10px; font-size: 11px; color: #4a5a6e; letter-spacing: 3px; font-weight: 700; }

        .scene-container {
            position: relative;
            flex-grow: 1;
            background: #020308;
            overflow: hidden;
            transform-style: preserve-3d;
        }

        /* Live Rain Canvas */
        #rainCanvas {
            position: absolute;
            inset: 0;
            z-index: 7;
            pointer-events: none;
            opacity: 0.6;
        }

        /* =========================================
           WET STREET & VOLUMETRIC LIGHTING
           ========================================= */
        .street {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: #010102;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 6;
            overflow: hidden;
        }

        /* Wet asphalt reflection mask */
        .street::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.2), #010102);
            z-index: 10;
        }

        .reflection-layer {
            position: absolute;
            top: 0;
            left: 70px; /* Aligned with 3D building */
            width: 180px;
            height: 100%;
            transform: scaleY(-1) skewX(10deg);
            transform-origin: top;
            opacity: 0.25;
            filter: blur(6px);
            z-index: 7;
        }

        /* Volumetric Streetlamp */
        .streetlamp {
            position: absolute;
            top: -20px;
            left: -40px;
            width: 250px;
            height: 600px;
            background: polygon(50% 0%, 100% 100%, 0% 100%);
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            background: linear-gradient(to bottom, rgba(0, 170, 255, 0.15), transparent);
            z-index: 5;
            pointer-events: none;
            transform: rotate(-15deg);
        }

        /* =========================================
           TRUE 3D ARCHITECTURE
           ========================================= */
        .building-3d-wrapper {
            position: absolute;
            bottom: 70px;
            right: 40px;
            width: 140px;
            height: 480px;
            perspective: 800px;
            z-index: 4;
        }

        .building {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transform: rotateY(-25deg); /* Gives realistic 3D depth */
            transition: all 1.5s ease;
        }

        /* Front Face */
        .face-front {
            position: absolute;
            width: 140px;
            height: 480px;
            background: linear-gradient(to bottom, #060a14, #020308);
            border: 1px solid rgba(0, 170, 255, 0.1);
            transform: translateZ(30px);
            display: flex;
            flex-direction: column-reverse;
            padding: 15px 10px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        /* Side Face (Depth) */
        .face-side {
            position: absolute;
            width: 60px;
            height: 480px;
            background: linear-gradient(to bottom, #03050a, #010204);
            border: 1px solid rgba(0, 170, 255, 0.05);
            transform: rotateY(90deg) translateZ(110px);
            display: flex;
            flex-direction: column-reverse;
            padding: 15px 5px;
            box-sizing: border-box;
            justify-content: space-between;
            filter: brightness(0.6); /* Realistic ambient occlusion */
        }

        .window-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            height: 14px;
            margin-bottom: 6px;
        }

        .window {
            width: 18%;
            height: 100%;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 1px;
            transition: all 0.5s ease;
        }

        .face-side .window { width: 40%; }

        /* Realistic Multi-Tone Lighting */
        .window.active-warm { background: #fdf0d5; box-shadow: 0 0 15px #fdf0d5, inset 0 0 5px #ffffff; }
        .window.active-gold { background: #f5b041; box-shadow: 0 0 20px #f5b041, inset 0 0 5px #ffffff; }
        .window.active-cool { background: #d4e8ff; box-shadow: 0 0 12px #d4e8ff, inset 0 0 3px #ffffff; }

        /* =========================================
           REALISTIC WALKING SILHOUETTE
           ========================================= */
        .character-wrapper {
            position: absolute;
            bottom: 65px;
            left: -60px;
            width: 45px;
            height: 90px;
            z-index: 10;
            transform-origin: bottom center;
            filter: drop-shadow(15px 15px 10px rgba(0,0,0,0.9));
        }

        /* Solid SVG Silhouette of a man in a coat */
        .man-svg {
            width: 100%;
            height: 100%;
            fill: #010204; /* Pitch black silhouette */
            stroke: rgba(0, 170, 255, 0.3); /* Rim lighting from the streetlamp */
            stroke-width: 0.5;
        }

        /* Walking Animation CSS */
        .leg-l { animation: walkReal 1.2s infinite alternate ease-in-out; transform-origin: 50% 60%; }
        .leg-r { animation: walkReal 1.2s infinite alternate-reverse ease-in-out; transform-origin: 50% 60%; }

        @keyframes walkReal {
            0% { transform: rotate(-20deg) translateY(-2px); }
            50% { transform: rotate(0deg) translateY(0px); }
            100% { transform: rotate(20deg) translateY(-2px); }
        }

        .character-wrapper.walking {
            animation: walkToCenter 4s linear forwards;
        }

        @keyframes walkToCenter { to { left: 40px; } }

        /* =========================================
           CINEMATIC BRAND REVEAL 
           ========================================= */
        #logo {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%) scale(0.8) translateZ(50px);
            opacity: 0;
            z-index: 30;
        }

        #logo img {
            width: 120px;
            height: auto;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.8));
        }

        .brand-group {
            position: absolute;
            top: 38%;
            left: 50%;
            transform: translateX(-50%) translateY(30px) translateZ(60px);
            text-align: center;
            opacity: 0;
            z-index: 40;
            width: 340px;
            background: linear-gradient(180deg, rgba(3, 4, 8, 0.7), rgba(1, 2, 4, 0.9));
            padding: 24px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            backdrop-filter: blur(15px);
        }

        .brand-group h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #ffffff;
            text-shadow: 0 5px 15px rgba(0,0,0,1);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(245, 176, 65, 0.8), transparent);
            width: 0;
            margin: 16px auto;
            box-shadow: 0 0 10px rgba(245, 176, 65, 0.5);
        }

        .motto {
            margin: 0;
            font-size: 13px;
            letter-spacing: 4px;
            color: #7a8a9d;
            text-transform: uppercase;
            font-weight: 500;
            min-height: 18px;
        }

        .motto span.gold {
            color: #f5b041;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(245, 176, 65, 0.8);
        }
        
        .type-cursor {
            display: inline-block;
            width: 2px;
            height: 12px;
            background: #f5b041;
            margin-left: 4px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div class="ui-wrapper">
        <div class="top-bar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">ENVIRONMENT_RENDER // REALITY_ENGINE</span>
        </div>

        <div class="scene-container">
            
            <div class="lightning" id="lightning"></div>
            <div class="streetlamp"></div>
            <canvas id="rainCanvas"></canvas>
            <div class="fog"></div>

            <div class="building-3d-wrapper">
                <div class="building" id="buildingMesh">
                    <div class="face-front" id="faceFront"></div>
                    <div class="face-side" id="faceSide"></div>
                </div>
            </div>

            <div class="character-wrapper walking" id="walker">
                <svg class="man-svg" viewBox="0 0 100 200">
                    <circle cx="50" cy="30" r="14" />
                    <path d="M 38 45 L 62 45 L 68 80 L 32 80 Z" />
                    <path d="M 32 80 L 68 80 L 75 140 L 25 140 Z" />
                    <g class="leg-l">
                        <path d="M 35 140 L 45 140 L 42 190 L 30 195 Z" />
                    </g>
                    <g class="leg-r">
                        <path d="M 55 140 L 65 140 L 68 190 L 56 195 Z" />
                    </g>
                </svg>
            </div>

            <div class="street">
                <div class="reflection-layer" id="reflectionMesh"></div>
            </div>

            <div id="logo">
                <img src="https://i.ibb.co/WW7LK0rn/image.png" alt="Skyrben Logo">
            </div>
            
            <div class="brand-group" id="brandGroup">
                <h1>SKYRBEN CONSTRUCTION</h1>
                <div class="divider"></div>
                <p class="motto" id="mottoLine"><span class="type-cursor"></span></p>
            </div>

        </div>
    </div>

    <script>
        // 1. Rain Physics Engine
        const canvas = document.getElementById('rainCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 360;
        canvas.height = 680;

        const rainArray = [];
        for (let i = 0; i < 100; i++) {
            rainArray.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 15 + 10,
                speed: Math.random() * 10 + 15
            });
        }

        function drawRain() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            for (let i = 0; i < rainArray.length; i++) {
                let drop = rainArray[i];
                ctx.moveTo(drop.x, drop.y);
                ctx.lineTo(drop.x - 2, drop.y + drop.length); // Slight wind angle
                drop.y += drop.speed;
                drop.x -= 2;
                if (drop.y > canvas.height) {
                    drop.y = -20;
                    drop.x = Math.random() * canvas.width + 20;
                }
            }
            ctx.stroke();
            requestAnimationFrame(drawRain);
        }
        drawRain();

        // 2. Initial Lightning Flash
        setTimeout(() => {
            const flash = document.getElementById('lightning');
            flash.animate([
                { opacity: 0 }, { opacity: 0.8 }, { opacity: 0 }, { opacity: 0.4 }, { opacity: 0 }
            ], { duration: 400, easing: 'ease-out' });
        }, 1500);

        // 3. Construct 3D Windows Programmatically
        const faceFront = document.getElementById("faceFront");
        const faceSide = document.getElementById("faceSide");
        const reflectionMesh = document.getElementById("reflectionMesh");
        
        const totalRows = 20;
        
        // Build Front Face and Reflection
        for (let r = 0; r < totalRows; r++) {
            const rowF = document.createElement("div"); rowF.className = "window-row";
            const rowR = document.createElement("div"); rowR.className = "window-row";
            
            for (let w = 0; w < 4; w++) {
                const win = document.createElement("div"); win.className = "window front-win";
                const rWin = document.createElement("div"); rWin.className = "window";
                rowF.appendChild(win);
                rowR.appendChild(rWin);
            }
            faceFront.appendChild(rowF);
            reflectionMesh.appendChild(rowR);
        }

        // Build Side Face
        for (let r = 0; r < totalRows; r++) {
            const rowS = document.createElement("div"); rowS.className = "window-row";
            for (let w = 0; w < 2; w++) {
                const win = document.createElement("div"); win.className = "window side-win";
                rowS.appendChild(win);
            }
            faceSide.appendChild(rowS);
        }

        // 4. Sequence: Man Stops Walking
        setTimeout(() => {
            document.querySelectorAll('.leg-l, .leg-r').forEach(el => el.style.animation = 'none');
            const walker = document.getElementById("walker");
            walker.style.transform = "rotate(-2deg)"; // Look up at building
            lightUpRealisticBuilding();
        }, 4000);

        // 5. Realistic Organic Lighting Engine
        function lightUpRealisticBuilding() {
            const fWins = document.querySelectorAll(".front-win");
            const sWins = document.querySelectorAll(".side-win");
            const rWins = document.querySelectorAll("#reflectionMesh .window");

            const lightTypes = ["active-warm", "active-gold", "active-cool", "dark"];
            
            // Randomly assign realistic lighting colors, leaving some offices dark
            function illuminate(windowsArray, reflectArray = null) {
                windowsArray.forEach((win, index) => {
                    setTimeout(() => {
                        // 80% chance to turn on a light, 20% stays dark
                        if (Math.random() > 0.2) {
                            const lightColor = lightTypes[Math.floor(Math.random() * 3)];
                            win.classList.add(lightColor);
                            if (reflectArray) reflectArray[index].classList.add(lightColor);
                        }
                    }, Math.random() * 2000); // Organic, scattered turn-on times
                });
            }

            illuminate(fWins, rWins);
            illuminate(sWins);

            // Shift camera angle slightly when lights come on
            document.getElementById("buildingMesh").style.transform = "rotateY(-20deg) scale(1.02)";

            setTimeout(revealBrandIdentity, 2200);
        }

        // 6. Premium Reveal
        function revealBrandIdentity() {
            const logo = document.getElementById("logo");
            logo.style.transition = "all 1.5s cubic-bezier(0.16, 1, 0.3, 1)";
            logo.style.opacity = "1";
            logo.style.transform = "translateX(-50%) scale(1) translateZ(80px)";

            const brandGroup = document.getElementById("brandGroup");
            brandGroup.style.transition = "all 1.2s cubic-bezier(0.16, 1, 0.3, 1)";
            brandGroup.style.opacity = "1";
            brandGroup.style.transform = "translateX(-50%) translateY(0) translateZ(90px)";

            document.querySelector(".divider").animate(
                [ { width: "0" }, { width: "100%" } ],
                { duration: 1200, fill: "forwards", easing: "ease-out" }
            );

            setTimeout(typeMotto, 1000);
        }

        // 7. Terminal Typing
        function typeMotto() {
            const text = "WHERE QUALITY MEETS HERE";
            const target = document.getElementById("mottoLine");
            let i = 0;

            const typewriter = setInterval(() => {
                if (i < text.length) {
                    let str = text.substring(0, i + 1);
                    if (str.includes("QUALITY")) str = str.replace("QUALITY", "<span class='gold'>QUALITY</span>");
                    target.innerHTML = str + '<span class="type-cursor"></span>';
                    i++;
                } else {
                    clearInterval(typewriter);
                    setTimeout(() => document.querySelector('.type-cursor').style.display = 'none', 1000);
                }
            }, 50);
        }

        // 8. Exit & Redirect
        setTimeout(() => {
            document.body.style.transition = "opacity 1.5s ease";
            document.body.style.opacity = "0";
        }, 10500);

        setTimeout(() => {
            window.location.href = "https://sites.google.com/view/skyrbenconstruction-1/home";
        }, 12000);
    </script>
</body>
</html>
