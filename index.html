<script>
(() => {
"use strict";

const canvas=document.getElementById("fx");
const ctx=canvas.getContext("2d");
const fade=document.getElementById("fade");
const logo=document.getElementById("logo");
const brand=document.getElementById("brand");
const progress=document.querySelector("#progress i");
const enter=document.getElementById("enter");
const rings=[...document.querySelectorAll(".ring")];

const REDIRECT="https://sites.google.com/view/skyrbenconstruction-1/home";

let W=innerWidth,H=innerHeight,DPR=1;
let start=performance.now(),finished=false;
let mx=.5,my=.5,targetX=.5,targetY=.5;

function resize(){
  W=innerWidth;H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=W*DPR;canvas.height=H*DPR;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);resize();

addEventListener("mousemove",e=>{
  targetX=e.clientX/W;
  targetY=e.clientY/H;
});

const pts=Array.from({length:520},()=>({
  x:Math.random(),y:Math.random(),
  z:Math.random(),
  r:.4+Math.random()*1.6,
  a:.08+Math.random()*.55,
  p:Math.random()*Math.PI*2,
  s:.4+Math.random()*2
}));

const shards=Array.from({length:42},()=>({
  x:.2+Math.random()*.6,
  y:.18+Math.random()*.58,
  w:.012+Math.random()*.045,
  h:.002+Math.random()*.008,
  a:.03+Math.random()*.09,
  phase:Math.random()*6.28
}));

const goldDust=[];

function addDust(){
  for(let i=0;i<1;i++){
    const a=Math.random()*Math.PI*2;
    const r=50+Math.random()*150;
    goldDust.push({
      x:W*.5+Math.cos(a)*r,
      y:H*.46+Math.sin(a)*r*.55,
      vx:(W*.5-(W*.5+Math.cos(a)*r))*.008,
      vy:(H*.46-(H*.46+Math.sin(a)*r*.55))*.008,
      life:.3+Math.random()*.7,
      size:0.8+Math.random()*2.2
    });
  }
}

function background(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#010204");
  g.addColorStop(.42,"#06090d");
  g.addColorStop(.75,"#080c11");
  g.addColorStop(1,"#020305");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  const center=ctx.createRadialGradient(W*.5,H*.47,0,W*.5,H*.47,W*.54);
  center.addColorStop(0,"rgba(217,173,88,.075)");
  center.addColorStop(.30,"rgba(100,165,195,.022)");
  center.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=center;
  ctx.fillRect(0,0,W,H);

  /* depth particles */
  for(const p of pts){
    const wave=.55+.45*Math.sin(t*p.s+p.p);
    ctx.globalAlpha=p.a*wave;
    ctx.fillStyle=p.z>.72?"#dbeaf2":"#f2e4c2";
    ctx.beginPath();
    ctx.arc(
      p.x*W+(mx-.5)*p.z*18,
      p.y*H+(my-.5)*p.z*10,
      p.r*(.55+.8*p.z),
      0,Math.PI*2
    );
    ctx.fill();
  }
  ctx.globalAlpha=1;

  /* hairline abstract geometry */
  for(let i=0;i<shards.length;i++){
    const s=shards[i];
    const pulse=.5+.5*Math.sin(t*.6+s.phase);
    ctx.strokeStyle=`rgba(217,173,88,${s.a*pulse})`;
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(s.x*W,s.y*H);
    ctx.lineTo((s.x+s.w)*W,(s.y+s.h)*H);
    ctx.stroke();
  }
}

function updateGold(){
  for(let i=goldDust.length-1;i>=0;i--){
    const p=goldDust[i];
    p.life-=.025; // Dust fades faster now
    p.x+=p.vx;p.y+=p.vy;
    if(p.life<=0)goldDust.splice(i,1);
  }
  for(const p of goldDust){
    ctx.fillStyle=`rgba(246,223,170,${Math.max(0,p.life)})`;
    ctx.shadowBlur=12;ctx.shadowColor="#d9ad58";
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  }
  ctx.shadowBlur=0;
}

/* animation */
function frame(now){
  const t=(now-start)/1000;

  mx+=(targetX-mx)*.055;
  my+=(targetY-my)*.055;

  background(t);

  // --- FASTER TIMINGS ---
  const logoStart = 0.3;
  const logoDuration = 1.5; 
  const brandStart = 1.5; 
  const brandDuration = 0.6;
  const totalSceneTime = 3.5; 
  const fadeOutStart = totalSceneTime - 0.6; // 2.9s

  if(t > logoStart) {
    const p = clamp((t-logoStart)/logoDuration,0,1);
    const e = easeOut(p);
    logo.style.opacity = p;
    logo.style.transform = `translate(-50%,-50%) scale(${.12+.88*e})`;
    
    for(const r of rings){
      r.style.opacity = (p*.38);
    }
    rings.forEach((r,i)=>{
      const s=.35+(.72+ i*.08)*e;
      r.style.transform=
        `translate(-50%,-50%) scale(${s}) rotate(${i*14+e*20}deg)`;
    });

    if (t < 2.5 && Math.random() < 0.7) {
        addDust();
    }
  }

  if(t > brandStart) {
    const p = clamp((t-brandStart)/brandDuration,0,1);
    const e = easeOut(p);
    brand.style.opacity=p;
    brand.style.transform=
      `translate(-50%,${32-32*e}px)`;
  }

  updateGold();

  progress.style.width=(clamp(t/totalSceneTime,0,1)*100)+"%";

  // Adjusted screen fade timings
  if(t < 0.4) {
      fade.style.opacity = 1 - t/0.4;
  } else if(t < fadeOutStart) {
      fade.style.opacity = 0;
  } else {
      fade.style.opacity = clamp((t - fadeOutStart)/0.6, 0, 1);
  }

  if(t >= totalSceneTime && !finished){
    finished=true;
    location.href=REDIRECT;
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

enter.addEventListener("click",()=>{
  if(finished)return;
  finished=true;
  fade.style.opacity=1;
  setTimeout(()=>location.href=REDIRECT,300); // Faster manual click redirect
});
addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key==="Escape")enter.click();
});

function lerp(a,b,t){return a+(b-a)*t}
function easeOut(t){return 1-Math.pow(1-t,3)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

})();
</script>
</body>
</html>'''
