<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SKYRBEN Construction Intro</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="scene">

    <!-- Blueprint Grid -->
    <div class="grid"></div>

    <!-- Gold Dust -->
    <div class="particles"></div>

    <!-- Road -->
    <div class="road"></div>

    <!-- Building -->
    <div class="building">

        <div class="wireframe"></div>

        <div class="glass"></div>

        <div class="reflection"></div>

        <div class="windows" id="windows"></div>

    </div>

    <!-- Gold Energy -->
    <div class="energy" id="energy"></div>

    <!-- Logo -->

    <img
    id="logo"
    class="logo"
    src="https://i.ibb.co/1H1J1D7/image.png"
    alt="SKYRBEN">

    <!-- Brand -->

    <div class="brand" id="brand">

        <h1>SKYRBEN CONSTRUCTION</h1>

        <div class="divider"></div>

        <p>WHERE QUALITY MEETS HERE</p>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
