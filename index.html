<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SKYRBEN CONSTRUCTION</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
background:#08131d;
overflow:hidden;
height:100vh;
}

/* INTRO */

#intro{
position:fixed;
inset:0;
background:#08131d;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

/* Blueprint Grid */

.grid{
position:absolute;
inset:0;
background:
linear-gradient(rgba(0,170,255,.07) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,170,255,.07) 1px, transparent 1px);
background-size:40px 40px;
opacity:0;
animation:gridFade .8s forwards;
}

@keyframes gridFade{
to{opacity:1;}
}

/* Gold Dust */

.dust{
position:absolute;
width:100%;
height:100%;
}

.dust span{
position:absolute;
width:3px;
height:3px;
background:#f5b041;
border-radius:50%;
box-shadow:0 0 12px #f5b041;
animation:float 5s linear infinite;
}

@keyframes float{
0%{transform:translateY(100vh);opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-100vh);opacity:0;}
}

/* Tower */

.tower{
width:280px;
height:560px;
position:absolute;
}

.wire{
fill:none;
stroke:#00aaff;
stroke-width:3;
stroke-dasharray:2200;
stroke-dashoffset:2200;
filter:drop-shadow(0 0 10px #00aaff);
animation:draw 1.3s forwards;
animation-delay:.8s;
}

@keyframes draw{
to{stroke-dashoffset:0;}
}

.glass{
position:absolute;
width:130px;
height:380px;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:linear-gradient(
180deg,
rgba(255,255,255,.18),
rgba(255,255,255,.03)
);
opacity:0;
animation:glassAppear .8s forwards;
animation-delay:2s;
}

@keyframes glassAppear{
to{opacity:1;}
}

/* Reflection Sweep */

.glass::after{
content:"";
position:absolute;
top:0;
left:-50%;
width:40%;
height:100%;
background:
linear-gradient(
90deg,
transparent,
rgba(255,255,255,.35),
transparent
);
animation:sweep 1.2s forwards;
animation-delay:2.2s;
}

@keyframes sweep{
to{
left:120%;
}
}

/* Energy */

.energy{
position:absolute;
bottom:90px;
left:50%;
transform:translateX(-50%);
width:4px;
height:0;
background:#f5b041;
box-shadow:0 0 20px #f5b041;
animation:energyRise .8s forwards;
animation-delay:2.4s;
}

@keyframes energyRise{
to{
height:390px;
}
}

/* Logo */

.logo{
position:absolute;
top:15%;
left:50%;
transform:translateX(-50%) scale(.7);
width:140px;
opacity:0;
filter:drop-shadow(0 0 20px rgba(245,176,65,.8));
animation:logoReveal .7s forwards;
animation-delay:3s;
}

@keyframes logoReveal{
to{
opacity:1;
transform:translateX(-50%) scale(1);
}
}

/* Brand */

.brand{
position:absolute;
bottom:10%;
text-align:center;
opacity:0;
animation:textReveal .8s forwards;
animation-delay:3.4s;
}

.brand h1{
color:#f5b041;
font-size:42px;
letter-spacing:4px;
white-space:nowrap;
text-shadow:0 0 15px rgba(245,176,65,.8);
}

.brand p{
color:#fff;
margin-top:10px;
letter-spacing:3px;
font-size:12px;
}

@keyframes textReveal{
to{
opacity:1;
}
}

/* Fade */

.fade{
animation:fadeOut .6s forwards;
}

@keyframes fadeOut{
to{
opacity:0;
visibility:hidden;
}
}

@media(max-width:768px){

.brand h1{
font-size:24px;
}

.logo{
width:90px;
}

.tower{
width:200px;
height:420px;
}

}
</style>

</head>

<body>

<div id="intro">

<div class="grid"></div>

<div class="dust" id="dust"></div>

<img
class="logo"
src="https://i.ibb.co/1H1J1D7/image.png"
alt="SKYRBEN Logo">

<svg class="tower" viewBox="0 0 300 600">

<path class="wire"
d="M80 580
L80 120
L150 20
L220 120
L220 580
Z"/>

<path class="wire" d="M80 500 L220 500"/>
<path class="wire" d="M80 420 L220 420"/>
<path class="wire" d="M80 340 L220 340"/>
<path class="wire" d="M80 260 L220 260"/>
<path class="wire" d="M80 180 L220 180"/>
<path class="wire" d="M150 20 L150 580"/>

</svg>

<div class="glass"></div>

<div class="energy"></div>

<div class="brand">
<h1>SKYRBEN CONSTRUCTION</h1>
<p>WHERE QUALITY MEETS HERE</p>
</div>

</div>

<script>

const dust = document.getElementById("dust");

for(let i=0;i<40;i++){
const p=document.createElement("span");
p.style.left=Math.random()*100+"%";
p.style.animationDelay=Math.random()*5+"s";
dust.appendChild(p);
}

setTimeout(()=>{
document.getElementById("intro")
.classList.add("fade");
},4500);

setTimeout(()=>{
window.location.href=
"https://sites.google.com/view/skyrbenconstruction-1/home";
},5000);

</script>

</body>
</html>
