<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyrben Construction - Cinematic Intro</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* =========================================
           CORE ENVIRONMENTS & BACKGROUNDS
           ========================================= */
        body {
            margin: 0;
            background-color: #020408;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Tech Atmosphere background */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 170, 255, 0.15) 0%, transparent 70%);
            z-index: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* =========================================
           THE PHONE/TERMINAL CONTAINER
           ========================================= */
        .ui-wrapper {
            position: relative;
            z-index: 10;
            background: #050811;
            border: 1px solid rgba(0, 170, 255, 0.25);
            border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 30px rgba(0, 170, 255, 0.1);
            width: 360px;
            height: 680px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .top-bar {
            background: rgba(255, 255, 255, 0.02);
            padding: 14px 18px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(0, 170, 255, 0.15);
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .dot.red { background: #ff5f56; }
        .dot.yellow { background: #ffbd2e; }
        .dot.green { background: #27c93f; }
        .title { margin-left: 10px; font-size: 12px; color: #00aaff; letter-spacing: 2px; font-weight: 700; }

        .scene-container {
            position: relative;
            flex-grow: 1;
            background: linear-gradient(to bottom, #040712 60%, #091026 100%);
            overflow: hidden;
        }

        /* =========================================
           THE STREET & PERSPECTIVE SCENE
           ========================================= */
        .street {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #03050a;
            border-top: 3px solid #00aaff;
            box-shadow: 0 -5px 20px rgba(0, 170, 255, 0.3);
            z-index: 5;
        }

        .sidewalk-lines {
            position: absolute;
            top: 0;
            width: 100%;
            height: 4px;
            background-image: linear-gradient(90deg, #00aaff 70%, transparent 70%);
            background-size: 30px 100%;
            opacity: 0.4;
        }

        /* =========================================
           DYNAMIC SKYCRAPER (STARTS DARK)
           ========================================= */
        .building {
            position: absolute;
            bottom: 58px;
            right: 25px;
            width: 160px;
            height: 440px;
            background: linear-gradient(to top, #060b18, #03050d);
            border: 2px solid rgba(0, 170, 255, 0.15);
            border-bottom: none;
            z-index: 2;
            display: flex;
            flex-direction: column-reverse; /* Allows rows to light up from bottom to top */
            padding: 15px 10px;
            box-sizing: border-box;
            justify-content: space-between;
        }

        .window-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            height: 12px;
            margin-bottom: 6px;
        }

        .window {
            width: 16px;
            height: 100%;
            background: rgba(0, 170, 255, 0.05);
            border-radius: 2px;
            transition: all 0.4s ease;
        }

        /* The active glowing gold state */
        .window.active {
            background: #f5b041;
            box-shadow: 0 0 12px #f5b041, inset 0 0 4px #ffffff;
            transform: scale(1.05);
        }

        /* Roof Antenna Grid */
        .antenna {
            position: absolute;
            top: -30px;
            left: 30px;
            width: 2px;
            height: 30px;
            background: rgba(0, 170, 255, 0.3);
        }
        .antenna-dot {
            position: absolute;
            top: -35px;
            left: 29px;
            width: 4px;
            height: 4px;
            background: #ff5f56;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff5f56;
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* =========================================
           THE WALKING MAN (SVG SKELETON)
           ========================================= */
        .character-wrapper {
            position: absolute;
            bottom: 55px;
            left: -50px; /* Start off screen */
            width: 50px;
            height: 70px;
            z-index: 6;
            transform-origin: bottom center;
        }

        /* Simple execution of CSS-driven walking logic */
        .man-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: #ffffff;
            stroke-width: 3.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            filter: drop-shadow(0 0 5px rgba(0, 170, 255, 0.5));
        }

        /* Strut animations for walking */
        .left-leg { animation: swing 0.8s infinite alternate ease-in-out; transform-origin: 25px 35px; }
        .right-leg { animation: swing 0.8s infinite alternate-reverse ease-in-out; transform-origin: 25px 35px; }
        .arms { animation: swing 0.8s infinite alternate ease-in-out; transform-origin: 25px 22px; }

        @keyframes swing {
            0% { transform: rotate(-25deg); }
            100% { transform: rotate(25deg); }
        }

        /* JS moves the wrapper position across frame */
        .character-wrapper.walking {
            animation: walkToCenter 3.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }

        @keyframes walkToCenter {
            to { left: 65px; }
        }

        /* =========================================
           BRAND REVEAL OVERLAYS (SICK MULTI-STAGE)
           ========================================= */
        #logo {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%) scale(0);
            opacity: 0;
            z-index: 20;
        }

        #logo img {
            width: 100px;
            height: auto;
            filter: drop-shadow(0 10px 20px rgba(245, 176, 65, 0.5));
        }

        @keyframes floatLogo {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50% { transform: translateX(-50%) translateY(-10px); }
        }

        .brand-group {
            position: absolute;
            top: 32%;
            left: 50%;
            transform: translateX(-50%) translateY(30px);
            text-align: center;
            opacity: 0;
            z-index: 30;
            width: 330px;
            background: linear-gradient(180deg, rgba(3, 5, 10, 0.92), rgba(7, 12, 26, 0.96));
            padding: 22px 12px;
            border-radius: 12px;
            border: 1px solid rgba(0, 170, 255, 0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .brand-group h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 5px;
            color: #ffffff;
            white-space: nowrap;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .divider {
            height: 2px;
            background: linear-gradient(90deg, transparent, #f5b041, transparent);
            width: 0;
            margin: 14px auto;
            box-shadow: 0 0 12px #f5b041;
        }

        .motto {
            margin: 0;
            font-size: 14px;
            letter-spacing: 4px;
            color: #8a99ad;
            text-transform: uppercase;
            font-weight: 600;
            min-height: 18px;
        }

        .motto span.gold {
            color: #f5b041;
            font-weight: 700;
            text-shadow: 0 0 15px rgba(245, 176, 65, 0.7);
        }
        
        .type-cursor {
            display: inline-block;
            width: 2px;
            height: 13px;
            background: #f5b041;
            margin-left: 3px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- MAIN TERMINAL WRAPPER -->
    <div class="ui-wrapper">
        <div class="top-bar">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <span class="title">ENVIRONMENT_ENGAGED // RUN</span>
        </div>

        <div class="scene-container">
            
            <!-- Dynamic Skycraper -->
            <div class="building" id="buildingMesh">
                <div class="antenna"></div>
                <div class="antenna-dot"></div>
                <!-- Windows rows are dynamically built by JavaScript -->
            </div>

            <!-- Vector Walking Man -->
            <div class="character-wrapper walking" id="walker">
                <svg class="man-svg" viewBox="0 0 50 70">
                    <!-- Head -->
                    <circle cx="25" cy="12" r="5" stroke="#ffffff" fill="#050811" />
                    <!-- Spine/Body -->
                    <line x1="25" y1="17" x2="25" y2="35" />
                    <!-- Arms -->
                    <g class="arms">
                        <line x1="25" y1="22" x2="15" y2="32" />
                        <line x1="25" y1="22" x2="35" y2="32" />
                    </g>
                    <!-- Left Leg -->
                    <g class="left-leg">
                        <line x1="25" y1="35" x2="18" y2="52" />
                        <line x1="18" y1="52" x2="13" y2="66" />
                    </g>
                    <!-- Right Leg -->
                    <g class="right-leg">
                        <line x1="25" y1="35" x2="32" y2="52" />
                        <line x1="32" y1="52" x2="37" y2="66" />
                    </g>
                </svg>
            </div>

            <!-- Environment Ground Elements -->
            <div class="street">
                <div class="sidewalk-lines"></div>
            </div>

            <!-- MAIN BRAND ELEMENTS -->
            <div id="logo">
                <img src="https://i.ibb.co/WW7LK0rn/image.png" alt="Skyrben Logo">
            </div>
            
            <div class="brand-group" id="brandGroup">
                <h1>SKYRBEN CONSTRUCTION</h1>
                <div class="divider"></div>
                <p class="motto" id="mottoLine"><span class="type-cursor"></span></p>
            </div>

        </div>
    </div>

    <!-- =========================================
         CINEMATIC SCRIPT PIPELINE
         ========================================= -->
    <script>
        const buildingMesh = document.getElementById("buildingMesh");
        const walker = document.getElementById("walker");
        const totalRows = 18;
        const windowsPerRow = 5;

        // 1. Construct the building windows programmatically
        for (let r = 0; r < totalRows; r++) {
            const row = document.createElement("div");
            row.className = "window-row";
            for (let w = 0; w < windowsPerRow; w++) {
                const win = document.createElement("div");
                win.className = "window";
                row.appendChild(win);
            }
            buildingMesh.appendChild(row);
        }

        // 2. Step Sequence: Man walks, then stops in center frame
        setTimeout(() => {
            // Stop leg movement animations when he finishes his horizontal walk
            const elements = document.querySelectorAll('.left-leg, .right-leg, .arms');
            elements.forEach(el => el.style.animation = 'none');
            
            // Adjust posture subtly to look upward at the building
            walker.style.transform = "scaleX(1) rotate(-3deg)";
            
            // Begin the massive bottom-to-top window cascade immediately!
            lightUpBuilding();
        }, 3200);

        // 3. Lighting Architecture Engine (Cascades up row by row)
        function lightUpBuilding() {
            const rows = document.querySelectorAll(".window-row");
            rows.forEach((row, rowIndex) => {
                setTimeout(() => {
                    const wins = row.querySelectorAll(".window");
                    wins.forEach(w => w.classList.add("active"));
                }, rowIndex * 90); // Smooth upward traveling speed
            });

            // Trigger Identity Core Reveal right as lighting approaches structural peak
            setTimeout(revealBrandIdentity, 1200);
        }

        // 4. Ultra Premium Brand Assembly Engine
        function revealBrandIdentity() {
            // Drop-in bouncing Logo
            const logo = document.getElementById("logo");
            logo.style.transition = "all 1.1s cubic-bezier(0.34, 1.56, 0.64, 1)";
            logo.style.opacity = "1";
            logo.style.transform = "translateX(-50%) scale(1)";
            
            setTimeout(() => { 
                logo.style.animation = "floatLogo 4s ease-in-out infinite"; 
            }, 1100);

            // Pop Content Frame Upward
            const brandGroup = document.getElementById("brandGroup");
            brandGroup.style.opacity = "1";
            brandGroup.style.transform = "translateX(-50%) translateY(0)";

            // Scale line outwards
            document.querySelector(".divider").animate(
                [ { width: "0" }, { width: "100%" } ],
                { duration: 900, fill: "forwards", easing: "ease-out" }
            );

            // Trigger typing execution pipeline
            setTimeout(typeMotto, 800);
        }

        // 5. Terminal Typing Module
        function typeMotto() {
            const completeText = "WHERE QUALITY MEETS HERE";
            const target = document.getElementById("mottoLine");
            let index = 0;

            const typewriter = setInterval(() => {
                if (index < completeText.length) {
                    let currentString = completeText.substring(0, index + 1);
                    
                    // Style matching for the core keyword
                    if (currentString.includes("QUALITY")) {
                        currentString = currentString.replace("QUALITY", "<span class='gold'>QUALITY</span>");
                    }
                    
                    target.innerHTML = currentString + '<span class="type-cursor"></span>';
                    index++;
                } else {
                    clearInterval(typewriter);
                    // Drop text cursor cleanly
                    setTimeout(() => {
                        const cursor = document.querySelector('.type-cursor');
                        if (cursor) cursor.style.display = 'none';
                    }, 1200);
                }
            }, 55);
        }

        // 6. Complete System Exit Fade Out
        setTimeout(() => {
            document.body.style.transition = "opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1)";
            document.body.style.opacity = "0";
        }, 9000);

        // 7. Core Site Redirect Route
        setTimeout(() => {
            window.location.href = "https://sites.google.com/view/skyrbenconstruction-1/home";
        }, 10200);
    </script>
</body>
</html>
